version: 2

models:
  - name: dim_product
    description: "Product dimension containing one warehouse record per source product record."

    columns:
      - name: product_key
        description: "Unique warehouse-generated product key."
        data_tests:
          - not_null
          - unique

      - name: source_asin
        description: "Source product identifier from the original product catalog."
        data_tests:
          - not_null

      - name: product_title
        description: "Product title."
        data_tests:
          - not_null

      - name: price
        description: "Current product price."
        data_tests:
          - not_null

      - name: commission_rate
        description: "Affiliate commission rate."
        data_tests:
          - not_null



  - name: fct_clicks
    description: "Fact table containing one row per affiliate click event."

    columns:
      - name: click_id
        description: "Unique identifier for the affiliate click."
        data_tests:
          - not_null
          - unique

      - name: user_id
        description: "Identifier of the user who generated the click."
        data_tests:
          - not_null

      - name: session_id
        description: "Identifier of the session containing the click."
        data_tests:
          - not_null

      - name: clicked_at
        description: "Timestamp when the affiliate click occurred."
        data_tests:
          - not_null

      - name: source_asin
        description: "Source product identifier associated with the click."
        data_tests:
          - not_null



  - name: fct_conversions
    description: "Fact table containing one row per affiliate conversion event."

    columns:
      - name: conversion_id
        description: "Unique identifier for the conversion event."
        data_tests:
          - not_null
          - unique

      - name: click_id
        description: "Affiliate click associated with the conversion. Null when the source conversion has no click attribution."
        data_tests:
          - relationships:
              to: ref('fct_clicks')
              field: click_id

      - name: user_id
        description: "User associated with the conversion."
        data_tests:
          - not_null

      - name: order_id
        description: "Order associated with the conversion."
        data_tests:
          - not_null

      - name: converted_at
        description: "Timestamp when the conversion occurred."
        data_tests:
          - not_null

      - name: source_asin
        description: "Source product identifier associated with the conversion."
        data_tests:
          - not_null

      - name: order_value
        description: "Order value generated by the conversion."
        data_tests:
          - not_null

      - name: commission_earned
        description: "Affiliate commission earned from the conversion."
        data_tests:
          - not_null


      
  - name: fct_page_behavior
    description: "Fact table containing one row per page-level behavior event within a session."

    columns:
      - name: session_id
        description: "Identifier of the user session."
        data_tests:
          - not_null

      - name: user_id
        description: "Identifier of the user."
        data_tests:
          - not_null

      - name: event_at
        description: "Timestamp of the page behavior event."
        data_tests:
          - not_null

      - name: page_url
        description: "URL associated with the page behavior event."
        data_tests:
          - not_null

      - name: page_type
        description: "Type of page visited."
        data_tests:
          - not_null


    
  - name: dim_customer
    description: "Customer dimension containing one row per unique user across all source systems."

    columns:
      - name: customer_key
        description: "Unique warehouse-generated customer key."
        data_tests:
          - not_null
          - unique

      - name: user_id
        description: "Business identifier for the customer."
        data_tests:
          - not_null
          - unique

      - name: first_seen_at
        description: "Earliest known customer activity timestamp."
        data_tests:
          - not_null

      - name: last_seen_at
        description: "Most recent known customer activity timestamp."
        data_tests:
          - not_null


  - name: dim_date
    description: "Date dimension used for consistent time-based analysis."

    columns:
      - name: date_day
        description: "Calendar date."
        data_tests:
          - not_null
          - unique

      - name: year
        description: "Calendar year."
        data_tests:
          - not_null

      - name: month
        description: "Calendar month number."
        data_tests:
          - not_null

      - name: quarter
        description: "Calendar quarter."
        data_tests:
          - not_null

      - name: day_name
        description: "Name of the day."
        data_tests:
          - not_null


  - name: int_clicks_enriched
    description: "Click events enriched with warehouse product attributes."

    columns:
      - name: click_id
        description: "Unique affiliate click."
        data_tests:
          - not_null
          - unique

      - name: product_key
        description: "Warehouse product key resolved from the product dimension."
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_product')
                field: product_key

      - name: user_id
        description: "User associated with the click."
        data_tests:
          - not_null

      - name: clicked_at
        description: "Timestamp of the click."
        data_tests:
          - not_null


  - name: int_conversions_enriched
    description: "Conversion events enriched with customer and product warehouse keys."

    columns:
      - name: conversion_id
        description: "Unique conversion event."
        data_tests:
          - not_null
          - unique

      - name: customer_key
        description: "Warehouse customer key."
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_customer')
                field: customer_key

      - name: product_key
        description: "Warehouse product key."
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_product')
                field: product_key

      - name: order_id
        description: "Order associated with the conversion."
        data_tests:
          - not_null

      - name: converted_at
        description: "Timestamp of the conversion."
        data_tests:
          - not_null

      - name: order_value
        description: "Order value generated by the conversion."
        data_tests:
          - not_null

      - name: commission_earned
        description: "Affiliate commission earned from the conversion."
        data_tests:
          - not_null


  - name: dim_affiliate
    description: "Affiliate dimension containing one row per affiliate partner."

    columns:
      - name: affiliate_key
        description: "Unique warehouse-generated affiliate key."
        data_tests:
          - not_null
          - unique

      - name: affiliate_id
        description: "Business identifier for the affiliate."
        data_tests:
          - not_null
          - unique

      - name: affiliate_name
        description: "Affiliate partner name."
        data_tests:
          - not_null

      - name: affiliate_type
        description: "Type of affiliate partner."
        data_tests:
          - not_null

      - name: country
        description: "Affiliate country."
        data_tests:
          - not_null

      - name: status
        description: "Current affiliate status."
        data_tests:
          - not_null


  - name: dim_merchant
    description: "Merchant dimension containing one row per merchant."

    columns:
      - name: merchant_key
        description: "Unique warehouse-generated merchant key."
        data_tests:
          - not_null
          - unique

      - name: merchant_id
        description: "Business identifier for the merchant."
        data_tests:
          - not_null
          - unique

      - name: merchant_name
        description: "Merchant name."
        data_tests:
          - not_null

      - name: merchant_category
        description: "Merchant business category."
        data_tests:
          - not_null

      - name: country
        description: "Merchant country."
        data_tests:
          - not_null

      - name: status
        description: "Current merchant status."
        data_tests:
          - not_null


  - name: dim_campaign
    description: "Campaign dimension containing one row per marketing campaign."

    columns:
      - name: campaign_key
        description: "Unique warehouse-generated campaign key."
        data_tests:
          - not_null
          - unique

      - name: campaign_id
        description: "Business identifier for the campaign."
        data_tests:
          - not_null
          - unique

      - name: campaign_name
        description: "Campaign name."
        data_tests:
          - not_null

      - name: campaign_type
        description: "Type of marketing campaign."
        data_tests:
          - not_null

      - name: channel
        description: "Primary campaign channel."
        data_tests:
          - not_null

      - name: status
        description: "Current campaign status."
        data_tests:
          - not_null


  - name: fct_synthetic_clicks
    description: "Production-scale synthetic affiliate click fact table. One row represents one affiliate click event."

    columns:
      - name: click_id
        description: "Unique synthetic click identifier."
        data_tests:
          - not_null
          - unique

      - name: affiliate_id
        description: "Affiliate responsible for the click."
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_affiliate')
                field: affiliate_id

      - name: merchant_id
        description: "Merchant associated with the click."
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_merchant')
                field: merchant_id

      - name: campaign_id
        description: "Campaign associated with the click."
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_campaign')
                field: campaign_id

      - name: customer_id
        description: "Customer associated with the click."
        data_tests:
          - not_null

      - name: product_id
        description: "Product associated with the click."
        data_tests:
          - not_null

      - name: clicked_at
        description: "Timestamp of the click event."
        data_tests:
          - not_null


  - name: fct_synthetic_conversions
    description: "Production-scale synthetic conversion fact table. One row represents one conversion event."

    columns:
      - name: conversion_id
        description: "Unique conversion identifier."
        data_tests:
          - not_null
          - unique

      - name: click_id
        description: "Click associated with the conversion."
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('fct_synthetic_clicks')
                field: click_id

      - name: affiliate_id
        description: "Affiliate associated with the conversion."
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_affiliate')
                field: affiliate_id

      - name: merchant_id
        description: "Merchant associated with the conversion."
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_merchant')
                field: merchant_id

      - name: campaign_id
        description: "Campaign associated with the conversion."
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_campaign')
                field: campaign_id

      - name: customer_id
        description: "Customer associated with the conversion."
        data_tests:
          - not_null

      - name: product_id
        description: "Product associated with the conversion."
        data_tests:
          - not_null

      - name: converted_at
        description: "Timestamp when the conversion occurred."
        data_tests:
          - not_null

      - name: order_id
        description: "Unique order identifier."
        data_tests:
          - not_null
          - unique

      - name: order_value
        description: "Value of the converted order."
        data_tests:
          - not_null

      - name: commission_earned
        description: "Affiliate commission earned from the order."
        data_tests:
          - not_null


  - name: mart_overall_funnel
    description: "Overall affiliate funnel KPI mart."

    columns:
      - name: total_clicks
        description: "Total unique affiliate clicks."
        data_tests:
          - not_null

      - name: converted_clicks
        description: "Unique clicks that generated at least one conversion."
        data_tests:
          - not_null

      - name: total_conversions
        description: "Total conversion events."
        data_tests:
          - not_null

      - name: click_to_conversion_rate_pct
        description: "Percentage of unique clicks that generated at least one conversion."
        data_tests:
          - not_null


  - name: mart_affiliate_performance
    description: "Daily affiliate performance mart. Grain: one row per affiliate per calendar day."

    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - affiliate_id
              - activity_date


    columns:
      - name: affiliate_id
        description: "Business identifier of the affiliate."
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_affiliate')
                field: affiliate_id

      - name: affiliate_key
        description: "Warehouse-generated affiliate key."
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_affiliate')
                field: affiliate_key

      - name: activity_date
        description: "Calendar date of affiliate activity."
        data_tests:
          - not_null

      - name: clicks
        description: "Number of unique clicks generated by the affiliate on the date."
        data_tests:
          - not_null

      - name: conversions
        description: "Number of conversion events generated by the affiliate on the date."
        data_tests:
          - not_null

      - name: order_value
        description: "Total order value generated by the affiliate on the date."
        data_tests:
          - not_null

      - name: commission_earned
        description: "Total commission earned by the affiliate on the date."
        data_tests:
          - not_null



  - name: mart_merchant_performance
    description: "Daily merchant performance mart. Grain: one row per merchant per calendar day."

    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - merchant_id
              - activity_date

    columns:
      - name: merchant_id
        description: "Business identifier of the merchant."
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_merchant')
                field: merchant_id

      - name: merchant_key
        description: "Warehouse-generated merchant key."
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_merchant')
                field: merchant_key

      - name: activity_date
        description: "Calendar date of merchant activity."
        data_tests:
          - not_null

      - name: clicks
        description: "Number of unique clicks generated for the merchant on the date."
        data_tests:
          - not_null

      - name: conversions
        description: "Number of conversion events generated for the merchant on the date."
        data_tests:
          - not_null

      - name: order_value
        description: "Total order value generated for the merchant on the date."
        data_tests:
          - not_null

      - name: commission_earned
        description: "Total commission generated for the merchant on the date."
        data_tests:
          - not_null



  - name: mart_campaign_performance
    description: "Daily campaign performance mart. Grain: one row per campaign per calendar day."

    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - campaign_id
              - activity_date

    columns:
      - name: campaign_id
        description: "Business identifier of the campaign."
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_campaign')
                field: campaign_id

      - name: campaign_key
        description: "Warehouse-generated campaign key."
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_campaign')
                field: campaign_key

      - name: activity_date
        description: "Calendar date of campaign activity."
        data_tests:
          - not_null

      - name: clicks
        description: "Number of unique clicks generated by the campaign on the date."
        data_tests:
          - not_null

      - name: conversions
        description: "Number of conversion events generated by the campaign on the date."
        data_tests:
          - not_null

      - name: order_value
        description: "Total order value generated by the campaign on the date."
        data_tests:
          - not_null

      - name: commission_earned
        description: "Total commission generated by the campaign on the date."
        data_tests:
          - not_null


  - name: mart_product_performance
    description: "Daily product performance mart. Grain: one row per product record per calendar day."

    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - product_id
              - product_title
              - activity_date

    columns:
      - name: product_id
        description: "Source product identifier."
        data_tests:
          - not_null

      - name: product_key
        description: "Warehouse-generated product key."
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_product')
                field: product_key

      - name: product_title
        description: "Product title used to disambiguate reused source ASINs."
        data_tests:
          - not_null

      - name: activity_date
        description: "Calendar date of product activity."
        data_tests:
          - not_null

      - name: clicks
        description: "Number of unique clicks for the product on the date."
        data_tests:
          - not_null

      - name: conversions
        description: "Number of conversion events for the product on the date."
        data_tests:
          - not_null

      - name: order_value
        description: "Total order value generated by the product on the date."
        data_tests:
          - not_null

      - name: commission_earned
        description: "Total commission generated by the product on the date."
        data_tests:
          - not_null
