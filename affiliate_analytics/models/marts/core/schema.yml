version: 2

models:
  - name: dim_product
    description: "Product dimension containing one warehouse record per source product record."

    columns:
      - name: product_key
        description: "Unique warehouse-generated product key."
        data_tests:
          - not_null
          - unique

      - name: source_asin
        description: "Source product identifier from the original product catalog."
        data_tests:
          - not_null

      - name: product_title
        description: "Product title."
        data_tests:
          - not_null

      - name: price
        description: "Current product price."
        data_tests:
          - not_null

      - name: commission_rate
        description: "Affiliate commission rate."
        data_tests:
          - not_null



  - name: fct_clicks
    description: "Fact table containing one row per affiliate click event."

    columns:
      - name: click_id
        description: "Unique identifier for the affiliate click."
        data_tests:
          - not_null
          - unique

      - name: user_id
        description: "Identifier of the user who generated the click."
        data_tests:
          - not_null

      - name: session_id
        description: "Identifier of the session containing the click."
        data_tests:
          - not_null

      - name: clicked_at
        description: "Timestamp when the affiliate click occurred."
        data_tests:
          - not_null

      - name: source_asin
        description: "Source product identifier associated with the click."
        data_tests:
          - not_null



  - name: fct_conversions
    description: "Fact table containing one row per affiliate conversion event."

    columns:
      - name: conversion_id
        description: "Unique identifier for the conversion event."
        data_tests:
          - not_null
          - unique

      - name: click_id
        description: "Affiliate click associated with the conversion. Null when the source conversion has no click attribution."
        data_tests:
          - relationships:
              to: ref('fct_clicks')
              field: click_id

      - name: user_id
        description: "User associated with the conversion."
        data_tests:
          - not_null

      - name: order_id
        description: "Order associated with the conversion."
        data_tests:
          - not_null

      - name: converted_at
        description: "Timestamp when the conversion occurred."
        data_tests:
          - not_null

      - name: source_asin
        description: "Source product identifier associated with the conversion."
        data_tests:
          - not_null

      - name: order_value
        description: "Order value generated by the conversion."
        data_tests:
          - not_null

      - name: commission_earned
        description: "Affiliate commission earned from the conversion."
        data_tests:
          - not_null


      
  - name: fct_page_behavior
    description: "Fact table containing one row per page-level behavior event within a session."

    columns:
      - name: session_id
        description: "Identifier of the user session."
        data_tests:
          - not_null

      - name: user_id
        description: "Identifier of the user."
        data_tests:
          - not_null

      - name: event_at
        description: "Timestamp of the page behavior event."
        data_tests:
          - not_null

      - name: page_url
        description: "URL associated with the page behavior event."
        data_tests:
          - not_null

      - name: page_type
        description: "Type of page visited."
        data_tests:
          - not_null


    
  - name: dim_customer
    description: "Customer dimension containing one row per unique user across all source systems."

    columns:
      - name: customer_key
        description: "Unique warehouse-generated customer key."
        data_tests:
          - not_null
          - unique

      - name: user_id
        description: "Business identifier for the customer."
        data_tests:
          - not_null
          - unique

      - name: first_seen_at
        description: "Earliest known customer activity timestamp."
        data_tests:
          - not_null

      - name: last_seen_at
        description: "Most recent known customer activity timestamp."
        data_tests:
          - not_null


  - name: dim_date
    description: "Date dimension used for consistent time-based analysis."

    columns:
      - name: date_day
        description: "Calendar date."
        data_tests:
          - not_null
          - unique

      - name: year
        description: "Calendar year."
        data_tests:
          - not_null

      - name: month
        description: "Calendar month number."
        data_tests:
          - not_null

      - name: quarter
        description: "Calendar quarter."
        data_tests:
          - not_null

      - name: day_name
        description: "Name of the day."
        data_tests:
          - not_null


  - name: int_clicks_enriched
    description: "Click events enriched with warehouse product attributes."

    columns:
      - name: click_id
        description: "Unique affiliate click."
        data_tests:
          - not_null
          - unique

      - name: product_key
        description: "Warehouse product key resolved from the product dimension."
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_product')
                field: product_key

      - name: user_id
        description: "User associated with the click."
        data_tests:
          - not_null

      - name: clicked_at
        description: "Timestamp of the click."
        data_tests:
          - not_null


  - name: int_conversions_enriched
    description: "Conversion events enriched with customer and product warehouse keys."

    columns:
      - name: conversion_id
        description: "Unique conversion event."
        data_tests:
          - not_null
          - unique

      - name: customer_key
        description: "Warehouse customer key."
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_customer')
                field: customer_key

      - name: product_key
        description: "Warehouse product key."
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_product')
                field: product_key

      - name: order_id
        description: "Order associated with the conversion."
        data_tests:
          - not_null

      - name: converted_at
        description: "Timestamp of the conversion."
        data_tests:
          - not_null

      - name: order_value
        description: "Order value generated by the conversion."
        data_tests:
          - not_null

      - name: commission_earned
        description: "Affiliate commission earned from the conversion."
        data_tests:
          - not_null


  - name: dim_affiliate
    description: "Affiliate dimension containing one row per affiliate partner."

    columns:
      - name: affiliate_key
        description: "Unique warehouse-generated affiliate key."
        data_tests:
          - not_null
          - unique

      - name: affiliate_id
        description: "Business identifier for the affiliate."
        data_tests:
          - not_null
          - unique

      - name: affiliate_name
        description: "Affiliate partner name."
        data_tests:
          - not_null

      - name: affiliate_type
        description: "Type of affiliate partner."
        data_tests:
          - not_null

      - name: country
        description: "Affiliate country."
        data_tests:
          - not_null

      - name: status
        description: "Current affiliate status."
        data_tests:
          - not_null


  - name: dim_merchant
    description: "Merchant dimension containing one row per merchant."

    columns:
      - name: merchant_key
        description: "Unique warehouse-generated merchant key."
        data_tests:
          - not_null
          - unique

      - name: merchant_id
        description: "Business identifier for the merchant."
        data_tests:
          - not_null
          - unique

      - name: merchant_name
        description: "Merchant name."
        data_tests:
          - not_null

      - name: merchant_category
        description: "Merchant business category."
        data_tests:
          - not_null

      - name: country
        description: "Merchant country."
        data_tests:
          - not_null

      - name: status
        description: "Current merchant status."
        data_tests:
          - not_null


  - name: dim_campaign
    description: "Campaign dimension containing one row per marketing campaign."

    columns:
      - name: campaign_key
        description: "Unique warehouse-generated campaign key."
        data_tests:
          - not_null
          - unique

      - name: campaign_id
        description: "Business identifier for the campaign."
        data_tests:
          - not_null
          - unique

      - name: campaign_name
        description: "Campaign name."
        data_tests:
          - not_null

      - name: campaign_type
        description: "Type of marketing campaign."
        data_tests:
          - not_null

      - name: channel
        description: "Primary campaign channel."
        data_tests:
          - not_null

      - name: status
        description: "Current campaign status."
        data_tests:
          - not_null
